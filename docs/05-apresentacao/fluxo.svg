<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430">
  <rect width="1100" height="430" fill="#fff"/>
  <text x="550" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#111827">Fluxo principal de uso</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="30" y="125" width="150" height="110" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="105" y="165" font-size="18" font-weight="700" fill="#991b1b">1. Login</text>
    <text x="105" y="195" font-size="14" fill="#374151">Usuário entra no</text><text x="105" y="215" font-size="14" fill="#374151">sistema</text>
    <rect x="225" y="125" width="150" height="110" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="300" y="165" font-size="18" font-weight="700" fill="#1e3a8a">2. Validação</text>
    <text x="300" y="195" font-size="14" fill="#374151">JWT identifica</text><text x="300" y="215" font-size="14" fill="#374151">perfil e permissões</text>
    <rect x="420" y="125" width="150" height="110" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="495" y="165" font-size="18" font-weight="700" fill="#9a3412">3. Emissão</text>
    <text x="495" y="195" font-size="14" fill="#374151">Funcionário cria</text><text x="495" y="215" font-size="14" fill="#374151">o comunicado</text>
    <rect x="615" y="125" width="150" height="110" rx="14" fill="#fdf4ff" stroke="#a855f7" stroke-width="2"/>
    <text x="690" y="165" font-size="18" font-weight="700" fill="#7e22ce">4. Destino</text>
    <text x="690" y="195" font-size="14" fill="#374151">Turma ou aluno</text><text x="690" y="215" font-size="14" fill="#374151">específico</text>
    <rect x="810" y="125" width="150" height="110" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <text x="885" y="165" font-size="18" font-weight="700" fill="#166534">5. Entrega</text>
    <text x="885" y="195" font-size="14" fill="#374151">Aviso salvo e</text><text x="885" y="215" font-size="14" fill="#374151">enviado em tempo real</text>
    <rect x="925" y="300" width="150" height="85" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="1000" y="335" font-size="17" font-weight="700" fill="#334155">6. Resultado</text>
    <text x="1000" y="360" font-size="13" fill="#374151">Aluno lê e salva</text>
  </g>
  <g stroke="#6b7280" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M180 180 L225 180"/><path d="M375 180 L420 180"/><path d="M570 180 L615 180"/><path d="M765 180 L810 180"/>
    <path d="M885 235 C885 270 1000 270 1000 300"/>
  </g>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#6b7280"/></marker></defs>
</svg>
